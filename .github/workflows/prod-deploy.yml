name: CI/CD Prod Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/build.yml
    with:
      environment: prod
      deploy-path: /var/www/ivcf-api
      ssh-port: 22
    secrets:
      DEPLOY_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      DEPLOY_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      DEPLOY_SSH_USERNAME: ${{ secrets.PROD_SSH_USERNAME }}
      DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
